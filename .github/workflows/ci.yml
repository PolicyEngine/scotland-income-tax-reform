name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run unit tests
        run: pytest -q

  dashboard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: bun install --frozen-lockfile

      - name: Build dashboard
        working-directory: dashboard
        run: bun run build
      - name: Assert the PolicyEngine site shell is in the built HTML
        working-directory: dashboard
        run: |
          html=.next/server/app/index.html
          for needle in "PolicyEngine" ">Research<" ">Model<" ">API<" ">Donate<" "About us" "Developer tools" "Privacy policy" "Terms and conditions"; do
            grep -qF -- "$needle" "$html" || { echo "MISSING from built HTML: $needle"; exit 1; }
          done
          echo "Site shell present (brand, nav labels, footer links)."
